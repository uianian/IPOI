# 与 dataset/招股书关键信息抽取与风险特征定义.md 第二、三章一一对应
# source: 马宝灵 2026-07-01
# finance → 第二章标准化财务指标；legal → 第三章非标隐性风险特征

finance:
  description: "财务穿透Agent — 对应文档第二章（2.1损益表 / 2.2资产负债表 / 2.3现金流量表 / 2.4 18A专项）"
  doc_chapter: "二、标准化财务指标抽取清单"
  # 2.1–2.3：按表类型整表召回；仅附录一（概要/正文不取）
  appendix_only: true
  top_k_per_table: 3
  # 2.4 等非主表字段：仍按字段 Top-K
  top_k_per_field: 5
  top_k_per_query: 5
  # 非生物科技发行人：skip=跳过 2.4；downweight=保留但强降权
  non_biotech_gate: skip
  weights:
    grep: 0.40
    bm25: 0.25
    vector: 0.35
  grep_boost_rank: 5
  queries:
    # ---------- 2.1 / 2.2 / 2.3：三种主表整表召回（指标在表内，不按字段切 Top-K）----------
    - name: TBL_IS
      section: "2.1"
      field_code: TBL_IS
      table_type: income_statement
      recall_unit: table
      appendix_only: true
      label: "综合损益表"
      covers_fields:
        - REV
        - COGS
        - GP
        - GP_MARGIN
        - R&D_EXP
        - SG&A
        - NET_LOSS
        - ADJ_NET
      query: "綜合損益表 合併損益表 綜合全面收益表 合併綜合收益表 損益及其他全面收益表 綜合損益及其他全面開支表 綜合全面開支表"
      grep_terms:
        - 綜合損益表
        - 综合损益表
        - 合併損益表
        - 合并损益表
        - 損益及其他全面收益表
        - 綜合全面收益表
        - 综合全面收益表
        - 合併綜合收益表
        - 合并综合收益表
        - 损益及其他全面收益表
        - 綜合收益表
        - 综合收益表
        - 綜合損益及其他全面開支表
        - 综合损益及其他全面开支表
        - 損益及其他全面開支表
        - 损益及其他全面开支表
        - 綜合全面開支表
        - 综合全面开支表
        - 合併綜合全面收益表
        - 合并综合全面收益表
      title_hints:
        - 綜合損益表
        - 综合损益表
        - 合併損益表
        - 合并损益表
        - 損益及其他全面收益表
        - 綜合損益及其他全面收益表
        - 综合损益及其他全面收益表
        - 綜合全面收益表
        - 综合全面收益表
        - 合併綜合全面收益表
        - 合并综合全面收益表
        - 綜合損益及其他全面開支表
        - 综合损益及其他全面开支表
        - 損益及其他全面開支表
        - 损益及其他全面开支表
        - 綜合全面開支表
        - 综合全面开支表
        - 合併綜合損益及其他全面開支表
        - 合并综合损益及其他全面开支表
      row_labels:
        - 收入
        - 營業收入
        - 收益
        - 其他收入及收益
        - 銷售成本
        - 毛利
        - 研發成本
        - 研发成本
        - 年度／期間內利潤
        - 年／期內利潤
        - 年內溢利
        - 期内溢利
        - 年度／期間(虧損)／利潤
        - 年度／期間（虧損）／利潤
        - 年／期內虧損
        - 年內虧損
        - 期内虧損
        - 除税前虧損
        - 除稅前虧損
        - 除税前溢利
        - 除稅前溢利
      # 组1：收入类（含 18A 无产品收入时的「其他收入及收益」）
      # 组2：成本/毛利/期间损益（含「年／期内亏损」「研发成本」）
      must_have_groups:
        - [收入, 營業收入, 營業額, 收益, 其他收入及收益]
        - [銷售成本, 毛利, 年度／期間內利潤, 年／期內利潤, 年內溢利, 期内溢利, 年度／期間(虧損)／利潤, 年度／期間（虧損）／利潤, 年／期內虧損, 年內虧損, 期内虧損, 除税前虧損, 除稅前虧損, 除税前溢利, 除稅前溢利, 研發成本, 研发成本]
      min_row_label_hits: 2
      require_title_hint: true
      # 解析偶发把附录主表标成 text（如 18A 无收入损益表）；与 BS/CF 一致放开
      allow_text_as_table: true
      cross_page_continue: true
      max_continue_pages: 2
      prefer_categories: [table, title, text]

    - name: TBL_BS
