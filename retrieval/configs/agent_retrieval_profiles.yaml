        - 总资产
        - 資產總額
        - 资产总额
        - 總負債
        - 总负债
        - 負債總額
        - 负债总额
        - 資產淨值
        - 资产净值
        - 淨資產
        - 净资产
        - 權益總額
        - 权益总额
        - 現金及現金等價物
        - 现金及现金等价物
        - 貿易應收款項
        - 贸易应收款项
        - 貿易應付款項
        - 贸易应付款项
        - 非流動資產
        - 非流动资产
        - 流動資產
        - 流动资产
        - 非流動負債
        - 非流动负债
        - 非流動資產總值
        - 非流动资产总值
        - 流動資產總值
        - 流动资产总值
        - 流動負債總額
        - 流动负债总额
        - 資產總值減流動負債
