version: 1
purpose: T-1市场情绪证据输出跨年份首轮实验
selection_principles:
  - 覆盖2020至2025六个上市年份
  - 覆盖消费、医疗、TMT、金融、地产和工业等行业
  - 2020样本保留VHSI不可得的MVP情形，用于验证早期年份缺失处理
  - 优先选择行业映射明确且结构化市场数据可用的公司
  - outcome字段仅在Agent完成后用于实验评价，绝不进入Agent输入

