firecrawl:
  # 可以直接把 Key 填在这里；更推荐写入同目录下、不会提交到 Git 的
  # firecrawl.local.yaml，或使用环境变量 FIRECRAWL_API_KEY。
  api_key: ""
  api_url: "https://api.firecrawl.dev"
  enabled: true

  # on_missing：本地没有截止日前新闻时才联网；always：每次联网并合并缓存；
  # never：完全关闭联网，但仍读取已有本地新闻。
  fetch_policy: "on_missing"

  search:
    # 历史中文新闻在 web 索引覆盖通常高于 news；仍只调用一次 search。
    sources: ["web"]
    # 每家公司只调用一次 search，合计最多返回 5 个 URL。
    limit_per_query: 5
    max_urls: 5
    timeout_ms: 60000
    location: "Hong Kong"
    query_template: '"{company}" 风险 争议 监管 舆论 新闻'
    use_tbs_date_filter: true
    historical_lookback_years: 5
    exclude_domains: ["xincailiao.com"]

  scrape:
    # 对本次搜索得到的 URL 最多执行 5 次独立正文抓取。
    max_requests: 5
    only_main_content: true
    max_content_chars: 8000
    timeout_ms: 30000
    max_age_ms: 86400000
    # 原始正文和HTML用于离线补提发布日期；不会直接进入评分。
    max_raw_content_chars: 100000
    max_raw_html_chars: 250000

  cache:
    merge_existing: true
    # 无论日期校验是否通过，都保存搜索结果和正文；后续默认复用，避免重复扣费。
    save_raw_results: true
    reuse_raw_results: true

