# 总控决策 Agent：Prompt 清单 + 工程配额。终裁由 LLM 完成，本文件不覆盖等级。
score_scale: { min: 0, max: 100, higher_means: risk }

chapter5_checklist:
  high:
    - { code: CASH_RUNWAY_LT_12, label: "现金跑道 < 12 个月" }
    - { code: REDEMPTION_HIGH, label: "对赌/赎回高危（期限短或金额重大）" }
    - { code: CONCENTRATION_HIGH, label: "单一客户或供应商占比 > 50%" }
    - { code: VALUATION_INVERSION, label: "IPO 较 Pre-IPO 折价 > 30% 或估值倒挂" }
  medium:
    - { code: CASH_RUNWAY_12_24, label: "现金跑道 12–24 个月" }
    - { code: RELATED_PARTY_HIGH, label: "关联交易占比 > 30%" }
    - { code: CONCENTRATION_TOP5, label: "前五大客户占比 > 80%" }
    - { code: EMBELLISHMENT_HIGH, label: "文本粉饰度 ≥ 7" }

reference_weights:
  legal: 0.55
  finance: 0.45
  fundamental: 0.65
  market: 0.35

debate:
  max_rounds: 3
  max_questions_per_round: 4
  max_new_searches_per_question: 2
  excerpt_max_chars: 200
  hits_per_search: 4
  debate_max_tokens: 1024
  question_max_tokens: 800
  # 冲突研判 JSON 正文预算；DeepSeek 会另加 reasoning 预留。过小会被思考挤空。
  conflict_max_tokens: 2048
  conflict_reasoning_max_tokens: 512
  # 终裁 JSON 正文预算；辩论后输入变长，1200 会被思考/长字段挤空。
  decide_max_tokens: 4096
  decide_reasoning_max_tokens: 512
  embellishment_max_tokens: 1024
  debate_reasoning_effort: low
  debate_search:
    query_max_chars: 32
    max_pages: 4
    themes:
      redemption:
        finance_keywords: [贖回負債, 可轉換可贖回優先股, 可贖回優先股]
        legal_keywords: [購回權, 特別權利, 自動恢復, 股東協議]
        section_hint: [financial_information, history_and_corporate_structure, risk_factors]
        finance_intent: financing_dependency
        legal_intent: redemption
      cash_runway:
        finance_keywords: [現金及現金等價物, 經營活動所用現金, 流動資金及資本資源]
        legal_keywords: []
        section_hint: [financial_information]
        finance_intent: financing_dependency
        legal_intent: business_context
      related_party:
        finance_keywords: []
        legal_keywords: [關連交易, 百分比率, 年度上限]
        section_hint: [connected_transactions]
        finance_intent: business_context
        legal_intent: related_party
      concentration:
        finance_keywords: []
        legal_keywords: [前五大客戶, 前五大供應商]
        section_hint: [business, financial_information]
        finance_intent: business_context
        legal_intent: concentration
      valuation:
        finance_keywords: [估值, 發行價]
        legal_keywords: [估值倒掛, Pre-IPO]
        section_hint: [summary, financial_information]
        finance_intent: business_context
        legal_intent: business_context
      embellishment:
        finance_keywords: [領先, 第一]
        legal_keywords: [領先, 第一]
        section_hint: [summary, business]
        finance_intent: business_context
        legal_intent: business_context
    codes:
      CV_PREF_LIABILITY: [可轉換可贖回優先股, 贖回負債]
      REDEMPTION_HIGH: [購回權, 贖回負債, 特別權利]
      REDEMPTION_MEDIUM: [贖回負債, 購回權]
      RIGHTS_CLEANUP_INCOMPLETE: [特別權利, 自動恢復, 購回權]
      CASH_RUNWAY_12_24: [現金及現金等價物, 流動資金]
      CASH_RUNWAY_LT_12: [現金及現金等價物, 流動資金]
      BURN_YOY_UP_30: [經營活動所用現金, 現金流量]

embellishment:
  first_pages: 5
  page_char_cap: 1200
  buzzwords:
    - 领先
    - 第一
    - 最佳
    - 卓越
    - 革命性
    - 颠覆
    - 最大
    - 唯一

confidence_rubric: |
  高置信度：风险结论有≥2个独立证据来源（不同页或不同 Agent），且均能定位至招股书原文。
  中置信度：有1个证据来源，或存在间接推断。
  低置信度：基于模型推断，缺乏招股书原文证据。
