# 对应 dataset/招股书关键信息抽取与风险特征定义.md 第二章
source: "dataset/招股书关键信息抽取与风险特征定义.md §二"
sections:
  "2.1":
    table_code: TBL_IS
    fields:
      # 「收益」仅精确行匹配；「其他收入及收益」由 FIELD_LINE_REJECT 排除。18A 无产品收入时 REV 可缺失
      REV: { labels: ["營業收入", "营业收入", "營業額", "营业额", "收入", "收益"], unit: "千元" }
      OTHER_INCOME: { labels: ["其他收入及收益", "其他收入", "其他收益", "其他淨收入", "其他净收入"], unit: "千元", note: "非产品收入，不得计入 REV" }
      COGS: { labels: ["銷售成本", "销售成本", "营业成本"], unit: "千元" }
      GP: { labels: ["毛利"], unit: "千元" }
      GP_MARGIN: { derive: "GP / REV * 100" }
      RD_EXP: { labels: ["研發開支", "研发开支", "研发费用", "研發成本", "研发成本"] }
      SGA: { labels: ["銷售及分銷開支", "行政開支", "销售及营销费用"] }
      NET_LOSS: { labels: ["年度／期間內利潤", "年／期內利潤", "年內利潤", "年内利润", "期內利潤", "期内利润", "年內溢利", "年内溢利", "期内溢利", "期內溢利", "年／期內溢利", "年度/期間內利潤", "期／年內虧損及全面開支總額", "期／年內虧損及全面收益總額", "年內／期內總全面虧損", "年內／期內虧損", "年／期內虧損", "期／年內虧損", "期内亏损", "期內虧損", "年內虧損", "期内虧損", "除税前虧損", "除稅前虧損", "除所得稅前虧損", "除所得税前虧損", "税前虧損", "稅前虧損", "除税前溢利／（虧損）", "除稅前溢利／（虧損）", "除税前溢利/(虧損)", "除稅前溢利/(虧損)", "除税前溢利 (虧損)", "年／期內溢利 (虧損)", "經營虧損", "经营亏损"], note: "正数=盈利；行名在抽取层做括号/空格归一，不必穷举每一种写法" }
  "2.2":
    table_code: TBL_BS
    fields:
      # 「資產總值減流動負債」由抽数黑名单拒绝；可回退非流动+流动合计
      TOTAL_ASSETS: { labels: ["總資產", "总资产", "資產總額", "资产总额", "資產總值", "资产总值"] }
      TOTAL_LIAB: { labels: ["負債總額", "负债总额", "总负债", "總負債", "負債總值", "负债总值"] }
      NET_ASSETS: { labels: ["資產淨值", "资产净值", "淨資產", "净资产", "權益總額", "权益总额", "母公司擁有人應佔權益總額", "虧絀總額", "亏绌总额", "本公司擁有人應佔虧絀"] }
      CASH_EQ: { labels: ["現金及現金等價物", "现金及现金等价物"] }
      CV_PREF: { labels: ["可转换可赎回优先股", "可轉換可贖回優先股", "普通股贖回負債"] }
  "2.3":
    table_code: TBL_CF
    fields:
      CFO: { labels: ["經營活動所得現金流量淨額", "經營活動所用現金流量淨額", "經營活動所得現金淨額", "經營活動所用現金淨額", "經營活動所用的現金淨額", "經營活動所產生（所用）現金淨額", "經營活動所產生(所用)現金淨額", "经营活动所得现金净额", "經營活動所得／(所用)現金淨額", "經營活動所得／（所用）現金淨額", "經營活動產生／(所用)的現金淨額", "經營活動產生／（所用）的現金淨額", "經營活動產生／(所用)", "經營活動產生／（所用）", "經營活動所得／（所用）", "經營活動所得／(所用)", "經營所得／(所用)現金", "經營所得／（所用）現金", "經營活動現金流入淨額", "經營活動現金流出淨額"] }
      CFI: { labels: ["投資活動所用現金流量淨額", "投資活動所得現金流量淨額", "投資活動所用現金淨額", "投资活动所用现金净额", "投資活動所得／(所用)現金淨額", "投資活動所得／（所用）現金淨額", "投資活動 (所用) 所得現金淨額", "投資活動（所用）所得現金淨額", "投資活動現金流出淨額", "投資活動現金流入淨額"] }
      CFF: { labels: ["融資活動所得／(所用)的現金流量淨額", "融資活動所得現金流量淨額", "融資活動所用現金流量淨額", "融資活動所得現金淨額", "融资活动所得现金净额", "融資活動所得／(所用)現金淨額", "融資活動所得／（所用）現金淨額", "融資活動所得／（所用）現金流量淨額", "融資活動所得 (所用)", "融資活動所得（所用）", "融資活動現金流入／(流出)淨額", "融資活動現金流入/(流出)淨額"] }
      END_CASH: { labels: ["年／期末現金及現金等價物", "年度／期間末的現金及現金等價物", "年末現金及現金等價物", "現金及現金等價物結餘", "期末现金", "現金流量表列示的現金及現金等價物", "年／期末現金及現金等價物（以銀行結餘及現金呈列）"] }
  "2.4":
    gate: biotech_only
    fields: [CORE_PROD_CNT, PROD_STAGE, BURN_RATE, CASH_RUNWAY, PRE_IPO_FIN]
gates:
  section_3_4:
    require_unprofitable: true
    description: "仅未盈利企业评估现金跑道"
  section_2_4:
    require_biotech: true

# 可移植 Finance Skill（与 legal_schema.skills 同构）
skills:
  finance_profitability:
    maps_to: ["2.1"]
    keywords: ["毛利", "虧損", "亏损", "溢利", "淨利潤", "净利润", "營業額", "营业收入"]
    intents: ["business_context"]
    section_hints: ["financial_information", "summary"]
    queries:
      - "毛利率 虧損 溢利 營業額"
    risk_codes: [CONTINUOUS_LOSS, SINGLE_YEAR_LOSS, GP_MARGIN_DROP]
  finance_cash_flow:
    maps_to: ["2.3", "3.4"]
    keywords: ["現金", "现金", "經營活動", "经营活动", "現金流量", "燒錢", "跑道"]
    intents: ["financing_dependency"]
    section_hints: ["financial_information", "risk_factors"]
    queries:
      - "經營活動現金流 現金及現金等價物 資金需求"
    risk_codes: [CFO_NEGATIVE, CASH_RUNWAY_LT_12, CASH_RUNWAY_12_24, BURN_YOY_UP_30]
  finance_solvency:
    maps_to: ["2.2"]
    keywords: ["總資產", "负债", "負債", "優先股", "优先股", "可轉換可贖回", "淨資產"]
    intents: ["financing_dependency"]
    section_hints: ["financial_information", "history_and_corporate_structure"]
    queries:
      - "可轉換可贖回優先股 普通股贖回負債 總負債"
    risk_codes: [CV_PREF_LIABILITY]
  finance_business_context:
    maps_to: ["business"]
    keywords: ["加盟", "供應商", "供应商", "客戶", "客户", "融資", "融资", "所得款項", "商業模式"]
    intents: ["business_context", "franchise", "supply_chain", "financing_dependency"]
    section_hints: ["business", "risk_factors", "summary", "financial_information"]
    queries:
      - "加盟 特許經營 供應商集中 客戶集中"
      - "融資 資金需求 營運資金"
    biotech_extra_queries:
      - "融資 資金需求 營運資金 所得款項用途 現金消耗"
    risk_codes: [FRANCHISE_DEPENDENCY, SUPPLY_CONCENTRATION, FINANCING_DEPENDENCY]
